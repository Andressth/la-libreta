{% if pagina.paginator.num_pages > 1 %}
<nav class="paginacion" aria-label="Paginación">
  <span>Página {{ pagina.number }} de {{ pagina.paginator.num_pages }} ({{ pagina.paginator.count }} registros)</span>
  <span class="botones">
    {% if pagina.has_previous %}<a class="boton boton--quieto boton--chico" href="?{% for k, v in request.GET.items %}{% if k != 'pagina' %}{{ k }}={{ v|urlencode }}&{% endif %}{% endfor %}pagina={{ pagina.previous_page_number }}">Anterior</a>{% endif %}
    {% if pagina.has_next %}<a class="boton boton--quieto boton--chico" href="?{% for k, v in request.GET.items %}{% if k != 'pagina' %}{{ k }}={{ v|urlencode }}&{% endif %}{% endfor %}pagina={{ pagina.next_page_number }}">Siguiente</a>{% endif %}
  </span>
</nav>
{% endif %}
