{% if campo.widget_type == "checkbox" %}
<div class="campo{% if campo.errors %} campo--error{% endif %}{% if ancho %} ancho-completo{% endif %}">
  <label class="casilla">{{ campo }} <span>{{ campo.label }}</span></label>
  {% if campo.help_text %}<span class="ayuda">{{ campo.help_text }}</span>{% endif %}
  {% for e in campo.errors %}<span class="error-campo">{{ e }}</span>{% endfor %}
</div>
{% else %}
<div class="campo{% if campo.errors %} campo--error{% endif %}{% if ancho %} ancho-completo{% endif %}">
  <label for="{{ campo.id_for_label }}">{{ campo.label }}</label>
  {{ campo }}
  {% if campo.help_text %}<span class="ayuda">{{ campo.help_text }}</span>{% endif %}
  {% for e in campo.errors %}<span class="error-campo">{{ e }}</span>{% endfor %}
</div>
{% endif %}
