{% extends "base_app.html" %}
{% block titulo %}Confirmar{% endblock %}
{% block contenido %}
<form method="post" class="tarjeta tarjeta__cuerpo" style="max-width: 560px; display:flex; flex-direction:column; gap:1rem">
  {% csrf_token %}
  <h1>{{ titulo }}</h1>
  <p class="suave">{{ aviso }}</p>
  <div class="acciones-form">
    <button type="submit" class="boton boton--peligro boton--principal">Sí, eliminar</button>
    <a href="{{ volver }}" class="boton boton--quieto">Cancelar</a>
  </div>
</form>
{% endblock %}
